      - heading "Who gets mixed up with whom" [level=2] [ref=f1e460]
      - figure "Rows are the real driver, columns the model's first guess. A bright diagonal is a driver with a clear style. Bright squares off the diagonal are drivers who look alike in this data, often teammates in the same car." [ref=f1e461]:
        - generic "Confusion matrix of true driver against model guess" [ref=f1e462]
      - heading "What it cannot see" [level=2] [ref=f1e464]
      - paragraph [ref=f1e465]: "At 300 km/h a car covers about 22 m between telemetry samples, so a single braking point is only known to about ±11 m. The model works because the error averages out over many corners and many laps. It also cannot fully separate the driver from the car: a faster car carries more apex speed whoever drives it. Teammates in the same car are the honest test, and the matrix above shows where it passes and fails."
      - paragraph [ref=f1e466]: "The engine you hear is synthesised in your browser from each lap's gear, speed and throttle: the pitch is the firing frequency of a V6 at that RPM. No engine recordings are used. Team radio clips are the real ones from that session."
