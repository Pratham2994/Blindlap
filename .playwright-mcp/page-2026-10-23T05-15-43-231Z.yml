  - main:
    - article [ref=f1e10]:
      - heading "How it knows" [level=1] [ref=f1e11]: How itknows
      - paragraph [ref=f1e12]: Every lap in Blind Lap is a real push lap from 2025 or 2026 qualifying. The name, number and livery are gone. What is left is 10 numbers per corner that describe how the car was driven through it, and the model has to find the driver in those.
      - 'figure "3,669 laps from 40 qualifying sessions, 24 drivers. The red tick on each bar is what picking at random would score. The last bar is the hardest test: two drivers, same car, same session, and the model still has to find the right one." [ref=f1e13]':
        - generic [ref=f1e14]:
          - generic [ref=f1e15]: First guess is the driver
          - generic [ref=f1e19]: 35%
        - generic [ref=f1e20]:
          - generic [ref=f1e21]: Driver in its top three
          - generic [ref=f1e25]: 64%
        - generic [ref=f1e26]:
          - generic [ref=f1e27]: Names the right team
          - generic [ref=f1e31]: 49%
        - generic [ref=f1e32]:
          - generic [ref=f1e33]: Given the car, picks the right teammate
          - generic [ref=f1e37]: 71%
      - paragraph [ref=f1e39]: Each number comes from a circuit the model never trained on. To guess laps at Monza, it was trained on every other circuit, with Monza left out in every year. The game uses those same models, so the guesses you watch are made blind too.
      - heading "From telemetry to corners" [level=2] [ref=f1e40]
      - list [ref=f1e41]:
        - listitem [ref=f1e42]:
          - generic [ref=f1e43]: Download
          - generic [ref=f1e44]: Car telemetry (speed, throttle, brake, gear, RPM, DRS, about 3.7 samples a second), car position in 3D (about 4 a second) and team radio come from the public OpenF1 API. Corner positions come from MultiViewer's circuit maps.
        - listitem [ref=f1e45]:
          - generic [ref=f1e46]: One line per circuit
          - generic [ref=f1e47]: The fastest lap's position samples become a smooth closed spline. Every sample of every lap is projected onto it, so 1,200 m means the same spot on track for every driver. Laps that spin, cut or lose data are dropped.
        - listitem [ref=f1e48]:
          - generic [ref=f1e49]: Corner zones
          - generic [ref=f1e50]: The lap is split into one zone per corner. In each zone we measure where braking starts, how long it lasts, entry speed, minimum speed and where it happens, how soon the driver is back to full throttle, the deepest lift, and how far they coast.
        - listitem [ref=f1e51]:
          - generic [ref=f1e52]: Against the field
          - generic [ref=f1e53]: Each measurement becomes a robust z-score against every other push lap at the same corner in the same session. "Braked 9 m later than the field" survives a change of circuit; "braked at 112 m" does not.
        - listitem [ref=f1e54]:
          - generic [ref=f1e55]: Corner type
          - generic [ref=f1e56]: Corners are sorted into slow, medium and fast by the field's apex speed, and features go into a separate block per type. Drivers do not brake for a hairpin the way they lift for a sweeper.
        - listitem [ref=f1e57]:
          - generic [ref=f1e58]: Model
          - generic [ref=f1e59]: A multinomial logistic regression gives P(driver | corner). A lap's guess adds up the log-probabilities of its corners, divided by a temperature of 2.1 learnt on held-out laps, because the corners of one lap are not independent witnesses.
      - heading "New cars, same drivers" [level=2] [ref=f1e60]
      - paragraph [ref=f1e61]:
        - text: 2026 brought new cars and new rules. A model trained only on 41 sessions of 2025 (the same circuits, the old cars) was asked to name the driver of 1424 push laps from 17 sessions of 2026, 20 drivers who raced both years. It named the right driver on
        - strong [ref=f1e62]: 25%
        - text: of laps and had them in its top three on
        - strong [ref=f1e63]: 56%
        - text: (chance 5%). Part of a driver's style survives a change of car.
      - heading "Why a simple model" [level=2] [ref=f1e64]
      - paragraph [ref=f1e65]:
        - text: A gradient-boosted tree model on the same features scores
        - strong [ref=f1e66]: 43%
        - text: top-1 and
        - strong [ref=f1e67]: 73%
        - text: top-3, against
        - strong [ref=f1e68]: 35%
        - text: and
        - strong [ref=f1e69]: 64%
        - text: "for logistic regression. The linear model is slightly behind, and it can say why: every corner's push toward a driver is a sum of weight × feature, which is exactly what the evidence line in the game shows. It is also a few kilobytes of weights, so it runs in your browser."
      - heading "Accuracy by session" [level=2] [ref=f1e70]
      - figure "Top-1 accuracy on each session's laps, with the model trained on every other circuit. The red tick is chance. Short or flat-out circuits give fewer corners to read." [ref=f1e71]:
