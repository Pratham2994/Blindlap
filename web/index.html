<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f0ec" />
    <title>Blind Lap</title>
    <meta
      name="description"
      content="A real F1 qualifying lap with the name taken off. Three models read how the car takes each corner and guess who is driving. So do you."
    />
    <script>
      // Set the theme before first paint, so a dark-mode visitor never sees a white flash.
      try {
        var t = localStorage.getItem("blindlap.theme.v1");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e10600'/%3E%3Cpath d='M7 22h18' stroke='%23f1f0ec' stroke-width='4'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <header class="topbar" id="topbar">
      <a class="wordmark" href="#/" aria-label="Blind Lap, home">BLIND LAP</a>
      <button type="button" class="theme-toggle" aria-label="Switch to dark mode">Dark</button>
      <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="main-nav">Menu</button>
      <nav aria-label="Main" id="main-nav">
        <a href="#/" data-route="home">Home</a>
        <a href="#/play" data-route="play">Play</a>
        <a href="#/dna" data-route="dna">Driver DNA</a>
        <a href="#/battles" data-route="battles">Battles</a>
        <a href="#/lab" data-route="lab">Telemetry lab</a>
        <a href="#/how" data-route="how">How it knows</a>
      </nav>
    </header>
    <main id="view">
      <!-- The home headline, painted before the script has loaded (on a slow phone that takes a
           second or more); main.ts replaces it with the real page, in the same place. -->
      <div class="home shell">
        <section class="hero">
          <div class="hero-block">
            <h1 class="display">Who's<br />driving?</h1>
            <p class="lede">A real 2025 or 2026 F1 qualifying lap with the name taken off. Three models read every corner and guess the driver. So do you.</p>
            <a class="btn on-red" href="#/play"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor" /></svg> Start a lap</a>
          </div>
          <figure class="hero-stage frame">
            <div class="stage-slot"></div>
            <figcaption class="caps">Loading a circuit</figcaption>
          </figure>
        </section>
      </div>
      <script>
        // Only the home page starts from it; a link to any other page starts empty.
        var home = /^#?\/?$/.test(location.hash);
        if (!home) document.querySelector("#view .shell").remove();
        // The small data this page needs, asked for while the script is still downloading.
        var page = location.hash.replace(/^#\/?/, "").split("/")[0];
        ["index.json"]
          .concat(home ? ["report.json", "env/index.json"] : page === "play" || page === "mates" ? ["env/index.json"] : page === "how" ? ["report.json"] : page === "dna" ? ["dna.json", "careers.json"] : page === "battles" ? ["battles.json"] : [])
          .forEach(function (f) {
            var l = document.createElement("link");
            l.rel = "preload";
            l.as = "fetch";
            l.crossOrigin = "anonymous";
            l.href = "./data/" + f;
            document.head.appendChild(l);
          });
      </script>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
